[package]
name = "findocu"
version = "1.0.18"
description = "FinDocu – Finanzen & Dokumente"
authors = ["Roli"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "findocu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
fs2 = "0.4"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSGeometry", "NSError", "NSEnumerator", "NSCalendar", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSResponder", "NSPrintInfo", "NSPrintOperation"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "objc2-app-kit"] }
# v1.0.8: Apple-Kontakte lesen (contacts.rs)
block2 = "0.6"
objc2-contacts = { version = "0.3", default-features = false, features = ["std", "block2", "CNContactStore", "CNContact", "CNLabeledValue", "CNPhoneNumber", "CNPostalAddress", "CNFetchRequest", "CNContactFetchRequest"] }
