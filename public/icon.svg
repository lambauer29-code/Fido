    <path d="M290 188q22-12 44 2" stroke="#8a5226" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Nase -->
    <path d="M226 262c0-12 14-18 30-18s30 6 30 18c0 14-16 24-30 24s-30-10-30-24z" fill="#1f160f"/>
    <ellipse cx="247" cy="256" rx="8" ry="4.5" fill="#fff" opacity="0.55"/>
    <path d="M256 286v12" stroke="#1f160f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Dokument im Maul -->
  <g transform="rotate(-9 256 362)" filter="url(#sh)">
    <path d="M170 312h150l26 26v94a12 12 0 0 1-12 12H170a12 12 0 0 1-12-12V324a12 12 0 0 1 12-12z" fill="#ffffff"/>
    <path d="M320 312v18a8 8 0 0 0 8 8h18z" fill="#d6e4fb"/>
    <rect x="180" y="336" width="104" height="10" rx="5" fill="#0b63f6"/>
    <rect x="180" y="358" width="140" height="8" rx="4" fill="#b9cdf3"/>
    <rect x="180" y="376" width="122" height="8" rx="4" fill="#b9cdf3"/>
    <rect x="180" y="394" width="96" height="8" rx="4" fill="#b9cdf3"/>
    <circle cx="316" cy="418" r="18" fill="#00b3a4"/>
    <text x="316" y="425" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">€</text>
  </g>
