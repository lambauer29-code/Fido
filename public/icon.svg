    <circle cx="200" cy="222" r="19" fill="#1f160f"/>
    <circle cx="312" cy="222" r="19" fill="#1f160f"/>
    <circle cx="206" cy="215" r="6.5" fill="#fff"/>
    <circle cx="318" cy="215" r="6.5" fill="#fff"/>
